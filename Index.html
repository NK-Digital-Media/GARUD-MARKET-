<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garuda AI Market</title>
    <style>
        body { background: #000; color: #00f2ff; font-family: sans-serif; margin: 0; text-align: center; display: flex; flex-direction: column; min-height: 100vh; }
        .header { padding: 15px; border-bottom: 2px solid #00f2ff; background: #050505; }
        .orb { width: 80px; height: 80px; border: 3px solid #00f2ff; border-radius: 50%; margin: 20px auto; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 0 15px #00f2ff; }
        .btn-mic { background: #00f2ff; color: #000; border: none; padding: 15px 40px; border-radius: 50px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        #res-box { width: 90%; background: #0a1a1a; border: 1px solid #00f2ff; padding: 15px; margin: 10px auto; border-radius: 10px; min-height: 50px; color: #fff; text-align: left; font-size: 14px; }
        #chart { width: 98%; height: 500px; margin: 10px auto; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="header"><h2>🦅 GARUDA AI MARKET</h2></div>
    <div class="orb" id="orb">READY</div>
    <button class="btn-mic" onclick="startGaruda()">SAY COMMAND</button>
    <div id="res-box"><div id="msg">> Ready for Neeraj.</div></div>
    <div id="chart"><div id="tv_chart"></div></div>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
        new TradingView.widget({ "autosize": true, "symbol": "BINANCE:BTCUSDT", "interval": "15", "theme": "dark", "style": "1", "container_id": "tv_chart" });
        const KEY = "AIzaSyC2VZdRxnf2aO2HAhhRjQ4-qCHoPJyshi4";
        async function startGaruda() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const rec = new SpeechRecognition();
            rec.lang = 'hi-IN';
            rec.onstart = () => { document.getElementById('orb').innerText = "LISTENING"; };
            rec.onresult = async (e) => {
                const userMsg = e.results[0][0].transcript;
                document.getElementById('msg').innerText = "> Neeraj: " + userMsg;
                document.getElementById('orb').innerText = "THINKING";
                try {
                    const r = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent?key=${KEY}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: "Tum Neeraj ke assistant Garuda AI ho. Chhota hindi reply do: " + userMsg }] }] })
                    });
                    const d = await r.json();
                    const reply = d.candidates[0].content.parts[0].text;
                    document.getElementById('msg').innerText = "> Garuda: " + reply;
                    document.getElementById('orb').innerText = "ACTIVE";
                    const ut = new SpeechSynthesisUtterance(reply);
                    ut.lang = 'hi-IN';
                    window.speechSynthesis.speak(ut);
                } catch (err) {
                    document.getElementById('msg').innerText = "> Brain Error. Key check karein.";
                    document.getElementById('orb').innerText = "RETRY";
                }
            };
            rec.start();
        }
    </script>
</body>
</html>
